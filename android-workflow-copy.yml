name: Build Android app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Make sure the app targets Android 16 (API 36) as Google Play requires
        run: |
          sed -i -E 's/(targetSdkVersion *= *)[0-9]+/\136/; s/(compileSdkVersion *= *)[0-9]+/\136/' android/variables.gradle
          cat android/variables.gradle

      - name: Add app icons
        run: cp -r android-res/* android/app/src/main/res/

      - name: Copy the app into Android
        run: npx cap sync android

      - name: Build installable APK (debug-signed)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Sinhala-Grammar-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # ---- Optional: signed release files for the Play Store ----
      # Runs only if you have added the four KEYSTORE secrets (see README).
      - name: Build release files
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Sign release files
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cd android/app/build/outputs
          $BT/zipalign -p 4 apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks ../../../../release.jks --ks-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" --key-pass pass:"$KEY_PASSWORD" \
            --out Sinhala-Grammar-release.apk aligned.apk
          cp bundle/release/app-release.aab Sinhala-Grammar-release.aab
          jarsigner -keystore ../../../../release.jks -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" Sinhala-Grammar-release.aab "$KEY_ALIAS"

      - name: Save signed release files
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: Sinhala-Grammar-release
          path: |
            android/app/build/outputs/Sinhala-Grammar-release.apk
            android/app/build/outputs/Sinhala-Grammar-release.aab
